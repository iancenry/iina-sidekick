name: API Health

# Manual only. This used to run on a daily cron, which spent minutes every day
# and filed issues from a scheduled context. The probe is still worth having
# as a one-off before a release or when an upstream break is suspected, so it
# is a button, not a timer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check every API the plugin depends on
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run API health check
        env:
          # Optional. Without the secrets the run still verifies every
          # endpoint is alive and enforcing auth, but not response shapes.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DDD_API_KEY: ${{ secrets.DDD_API_KEY }}
        run: node scripts/check-apis.mjs
