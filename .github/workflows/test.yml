name: Test

# Every push and pull request that can change behaviour. Ubuntu, not macOS:
# the suite is pure Node with no dependencies, so it runs identically there
# and costs 1x minutes instead of 10x. No schedule: a timer would spend the
# monthly allowance checking code that has not changed.
#
# The version-agreement check the old workflow called scripts/ for now lives
# in tests/apis.test.mjs, along with the host allow-list scan. One `npm test`
# covers everything, and there is no separate script to delete by accident.
on:
  push:
    branches: [main]
    paths:
      - "main.js"
      - "sidebar.html"
      - "overlay.html"
      - "sidebar/**"
      - "tests/**"
      - "scripts/**"
      - "Info.json"
      - "package.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "main.js"
      - "sidebar.html"
      - "overlay.html"
      - "sidebar/**"
      - "tests/**"
      - "scripts/**"
      - "Info.json"
      - "package.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Parser and identification suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned because the suite asserts on Node's test runner and the vm
          # realm behaviour; a new major could change either.
          node-version: "24"

      - name: Run the suite
        run: npm test
